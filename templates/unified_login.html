{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Acceso — Solution Copiers</title>

<link rel="manifest" href="{% static 'pwa/manifest.json' %}">
<meta name="theme-color" content="#100808">
<link rel="icon" href="{% static 'images/favicon.ico' %}">
<link rel="apple-touch-icon" href="{% static 'images/icons/apple-touch-icon.png' %}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Solution Copiers">
<meta name="robots" content="noindex,nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;background:linear-gradient(135deg,#1A0E0E 0%,#221414 60%,#1A0E0E 100%);display:flex;align-items:center;justify-content:center;font-family:'Inter',system-ui,sans-serif;padding:1.5rem;-webkit-font-smoothing:antialiased;}
.card{background:#221414;border:1px solid #3A2020;border-radius:1.25rem;padding:2rem 1.75rem;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.logo{background:#fff;border-radius:.75rem;padding:.75rem 1rem;margin:0 auto 1.25rem;max-width:220px;box-shadow:0 8px 24px rgba(0,0,0,.35);}
.logo img{width:100%;height:auto;display:block;}
h1{text-align:center;font-size:1.125rem;font-weight:800;color:#F5EDEB;margin-bottom:.25rem;}
.sub{text-align:center;font-size:.75rem;color:#7A6060;margin-bottom:1.75rem;font-weight:500;text-transform:uppercase;letter-spacing:.08em;}
label{display:block;font-size:.72rem;font-weight:600;color:#C0A8A8;margin-bottom:.35rem;}
input{width:100%;padding:.65rem 1rem;border-radius:.625rem;border:1.5px solid #3A2020;background:#100808;color:#F5EDEB;font-size:.9rem;outline:none;margin-bottom:1rem;transition:border-color .18s,box-shadow .18s;font-family:inherit;}
input:focus{border-color:#C4121A;box-shadow:0 0 0 3px rgba(196,18,26,.15);}
input::placeholder{color:#7A6060;}
button{width:100%;padding:.75rem;border-radius:.625rem;border:none;background:linear-gradient(135deg,#C4121A,#5A0B0B);color:#fff;font-size:.9375rem;font-weight:700;cursor:pointer;letter-spacing:.01em;transition:opacity .18s,transform .15s;font-family:inherit;}
button:active{transform:scale(.98);opacity:.9;}
.error{background:rgba(239,68,68,.1);color:#EF4444;border:1px solid rgba(239,68,68,.2);border-radius:.625rem;padding:.625rem .875rem;font-size:.8rem;margin-bottom:1rem;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="{% static 'images/logo.webp' %}" alt="Solution Copiers">
  </div>
  <h1>Acceso</h1>
  <p class="sub">Administradores · Asesoras · Técnicos · Mensajeros</p>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <label for="id_username">Usuario</label>
    <input type="text" id="id_username" name="username" autocomplete="username" autofocus placeholder="Tu usuario">
    <label for="id_password">Contraseña</label>
    <input type="password" id="id_password" name="password" autocomplete="current-password" placeholder="••••••••">
    <button type="submit">Ingresar</button>
  </form>
</div>
</body>
</html>
