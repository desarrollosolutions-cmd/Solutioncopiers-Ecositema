[pytest]
DJANGO_SETTINGS_MODULE = solution_copiers.settings.development
python_files = tests.py test_*.py *_tests.py
addopts =
    --reuse-db
    --strict-markers
    --tb=short
    -v
    --color=yes
testpaths = tests
markers =
    unit: tests rápidos sin acceso a BD
    integration: tests con acceso a BD
    e2e: tests end-to-end de flujos completos
    slow: tests que tardan más de 1 segundo
    security: tests de seguridad
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
