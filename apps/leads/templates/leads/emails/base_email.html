<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block subject %}Solution Copiers{% endblock %}</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#f4f6f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1a2332;}
  .wrapper{max-width:600px;margin:0 auto;padding:24px 16px;}
  .card{background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .header{background:#1B3B6F;padding:28px 32px;text-align:center;}
  .header img{height:36px;}
  .header-title{color:#ffffff;font-size:15px;font-weight:500;margin-top:8px;opacity:.85;}
  .body{padding:32px;}
  .title{font-size:22px;font-weight:700;color:#1B3B6F;margin-bottom:8px;}
  .subtitle{font-size:14px;color:#6b7a8d;margin-bottom:24px;}
  .badge{display:inline-block;padding:4px 12px;border-radius:9999px;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
  .badge-new{background:#EFF6FF;color:#1D4ED8;}
  .badge-warning{background:#FFFBEB;color:#B45309;}
  .badge-success{background:#F0FDF4;color:#16A34A;}
  .badge-danger{background:#FEF2F2;color:#DC2626;}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0;}
  .info-item{background:#f8fafc;border-radius:8px;padding:12px 14px;border:1px solid #e8edf2;}
  .info-label{font-size:11px;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
  .info-value{font-size:14px;font-weight:600;color:#1a2332;}
  .divider{border:none;border-top:1px solid #e8edf2;margin:24px 0;}
  .btn{display:inline-block;padding:12px 28px;border-radius:8px;background:#1B3B6F;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;margin-top:8px;}
  .btn-secondary{background:#EFF6FF;color:#1B3B6F;}
  .note{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:14px 16px;font-size:13px;color:#92400e;margin:16px 0;}
  .note strong{display:block;margin-bottom:2px;}
  .footer{padding:20px 32px;text-align:center;font-size:12px;color:#9ca3af;border-top:1px solid #f1f5f9;}
  .footer a{color:#1B3B6F;text-decoration:none;}
  @media(max-width:540px){.info-grid{grid-template-columns:1fr;} .body,.header{padding:20px;}}
</style>
</head>
<body>
<div class="wrapper">
  <div class="card">
    <div class="header">
      <div style="color:#ffffff;font-size:20px;font-weight:800;letter-spacing:-0.5px;">Solution Copiers</div>
      <div class="header-title">{% block header_subtitle %}CRM — Notificación automática{% endblock %}</div>
    </div>
    <div class="body">
      {% block body %}{% endblock %}
    </div>
    <div class="footer">
      Este mensaje fue generado automáticamente por el CRM de
      <a href="https://solutioncopiers.com">Solution Copiers</a>.
      Por favor no respondas directamente a este email.
    </div>
  </div>
</div>
</body>
</html>
