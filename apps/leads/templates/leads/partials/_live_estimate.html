<div class="estimate-card">
    <div class="estimate-card-loading" :class="{ 'is-visible': estimate.isCalculating }"></div>

    <div class="estimate-card-header">
        <span>Estimación en vivo</span>
    </div>

    <template x-if="!interestArea">
        <div class="text-text-muted text-sm py-4 text-center">
            <svg class="w-10 h-10 mx-auto mb-3 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 11h.01M12 11h.01M15 11h.01M4 6h16M4 10h16M4 14h16M4 18h16"/>
            </svg>
            Selecciona un servicio para ver tu estimación.
        </div>
    </template>

    <template x-if="interestArea">
        <div>
            <div class="text-xs text-text-secondary mb-1 font-medium" x-text="currentInterestData?.label"></div>

            {# Consumibles: precio 0 sin producto = "A cotizar" #}
            <template x-if="interestArea === 'consumables' && estimate.total === 0">
                <div>
                    <div class="estimate-card-value" data-estimate-value style="font-size:1.5rem">
                        <span x-show="details.consumable_unit_price > 0">Calculando…</span>
                        <span x-show="!details.consumable_unit_price" class="text-text-muted" style="-webkit-text-fill-color:inherit">A cotizar</span>
                    </div>
                    <p x-show="!details.consumable_unit_price" class="text-xs text-text-muted mt-2">
                        Busca y selecciona un producto para ver el precio estimado.
                    </p>
                </div>
            </template>

            {# Todos los demás casos: muestra el total calculado #}
            <template x-if="interestArea !== 'consumables' || estimate.total > 0">
                <div>
                    <div class="estimate-card-value" data-estimate-value>
                        <span x-text="formatCurrency(estimate.total)"></span>
                    </div>
                    <div class="estimate-card-range" x-show="estimate.total > 0">
                        Rango: <span x-text="formatCurrency(estimate.range_min)"></span> – <span x-text="formatCurrency(estimate.range_max)"></span>
                    </div>
                </div>
            </template>

            {# Desglose Alquiler #}
            <template x-if="interestArea === 'rental' && currentStep >= 2">
                <div class="estimate-breakdown">
                    <div class="estimate-breakdown-row">
                        <span>Equipos</span>
                        <strong x-text="details.quantity + ' uds'"></strong>
                    </div>
                    <div class="estimate-breakdown-row">
                        <span>Páginas / mes</span>
                        <strong x-text="details.monthly_pages.toLocaleString('es-CO')"></strong>
                    </div>
                </div>
            </template>

            {# Desglose Cableado #}
            <template x-if="interestArea === 'cabling' && currentStep >= 2">
                <div class="estimate-breakdown">
                    <div class="estimate-breakdown-row">
                        <span>Puntos lógicos</span>
                        <strong x-text="details.logical_points"></strong>
                    </div>
                    <div class="estimate-breakdown-row">
                        <span>Puntos eléctricos</span>
                        <strong x-text="details.electrical_points"></strong>
                    </div>
                </div>
            </template>

            {# Desglose Consumibles #}
            <template x-if="interestArea === 'consumables' && currentStep >= 2 && details.consumable_unit_price > 0">
                <div class="estimate-breakdown">
                    <div class="estimate-breakdown-row">
                        <span>Precio unitario</span>
                        <strong x-text="formatCurrency(details.consumable_unit_price)"></strong>
                    </div>
                    <div class="estimate-breakdown-row">
                        <span>Cantidad</span>
                        <strong x-text="(details.consumable_qty || 1) + ' uds'"></strong>
                    </div>
                    <div class="estimate-breakdown-row" style="border-top:1px solid var(--color-border); padding-top:0.5rem; margin-top:0.25rem">
                        <span class="font-semibold">Total estimado</span>
                        <strong x-text="formatCurrency(details.consumable_unit_price * (details.consumable_qty || 1))"></strong>
                    </div>
                    <p class="text-xs text-text-muted mt-2">
                        * Precio público. Empresas y mayoristas obtienen descuento.
                    </p>
                </div>
            </template>

            <div class="mt-5 p-3.5 rounded-xl text-xs text-text-secondary"
                 style="background: var(--color-bg-alt); border: 1px solid var(--color-border)">
                <strong class="text-text-primary">Nota:</strong> estimación referencial. Recibirás una propuesta detallada en &lt; 24 h.
            </div>
        </div>
    </template>
</div>

<div class="mt-5 space-y-3">

        <div class="wizard-trust-icon">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
            </svg>
        </div>

    </div>

            </svg>

    <div class="wizard-trust-item">

    <div class="wizard-trust-item">

                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
            </svg>
        </div>

</div>
