<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Portal de Campo — Solution Copiers</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;background:linear-gradient(135deg,#0C1626 0%,#101E30 60%,#0C1626 100%);display:flex;align-items:center;justify-content:center;font-family:'Inter',system-ui,sans-serif;padding:1.5rem;}
.card{background:#101E30;border:1px solid #192D42;border-radius:1.25rem;padding:2rem 1.75rem;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.logo{width:3rem;height:3rem;border-radius:1rem;background:linear-gradient(135deg,#0EA5E9,#0284C7);display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;}
.logo svg{width:1.5rem;height:1.5rem;}
h1{text-align:center;font-size:1.125rem;font-weight:800;color:#E4F1FA;margin-bottom:.25rem;}
.sub{text-align:center;font-size:.75rem;color:#3E6E8A;margin-bottom:1.75rem;font-weight:500;text-transform:uppercase;letter-spacing:.08em;}
label{display:block;font-size:.72rem;font-weight:600;color:#7AAEC8;margin-bottom:.35rem;}
input{width:100%;padding:.65rem 1rem;border-radius:.625rem;border:1.5px solid #192D42;background:#070E18;color:#E4F1FA;font-size:.9rem;outline:none;margin-bottom:1rem;transition:border-color .18s,box-shadow .18s;font-family:inherit;}
input:focus{border-color:#0EA5E9;box-shadow:0 0 0 3px rgba(14,165,233,.15);}
input::placeholder{color:#3E6E8A;}
button{width:100%;padding:.75rem;border-radius:.625rem;border:none;background:linear-gradient(135deg,#0EA5E9,#0284C7);color:#fff;font-size:.9375rem;font-weight:700;cursor:pointer;letter-spacing:.01em;transition:opacity .18s,transform .15s;font-family:inherit;}
button:active{transform:scale(.98);opacity:.9;}
.error{background:rgba(239,68,68,.1);color:#EF4444;border:1px solid rgba(239,68,68,.2);border-radius:.625rem;padding:.625rem .875rem;font-size:.8rem;margin-bottom:1rem;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg fill="none" stroke="#fff" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
  </div>
  <h1>Portal de Campo</h1>
  <p class="sub">Solution Copiers · Equipo externo</p>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <label for="id_username">Usuario</label>
    <input type="text" id="id_username" name="username" autocomplete="username" autofocus placeholder="Tu usuario">
    <label for="id_password">Contraseña</label>
    <input type="password" id="id_password" name="password" autocomplete="current-password" placeholder="••••••••">
    <button type="submit">Ingresar</button>
  </form>
</div>
</body>
</html>
