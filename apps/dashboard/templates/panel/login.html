{% load static %}
<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Acceso — Portal Asesoras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'dist/css/main.css' %}">
  <style>
    :root,[data-theme="dark"]{--color-primary:#C4121A;--color-primary-dark:#5A0B0B;--color-bg:#100808;--color-bg-alt:#1A0E0E;--color-surface:#221414;--color-text-primary:#F5EDEB;--color-text-secondary:#C0A8A8;--color-text-muted:#7A6060;--color-border:#3A2020;--color-danger:#EF4444;}
    *,*::before,*::after{box-sizing:border-box;}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--color-bg);display:flex;align-items:center;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased;padding:1rem;}
    .login-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:1.25rem;padding:2.5rem 2rem;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4);}
    .login-logo{background:#fff;border-radius:.75rem;padding:.75rem 1rem;margin:0 auto 1.25rem;max-width:230px;box-shadow:0 6px 20px rgba(0,0,0,.3);}
    .login-logo img{width:100%;height:auto;display:block;}
    h1{font-size:1.375rem;font-weight:800;color:var(--color-text-primary);text-align:center;letter-spacing:-.03em;margin:0 0 .25rem;}
    .login-sub{font-size:.8125rem;color:var(--color-text-muted);text-align:center;margin-bottom:1.75rem;}
    .field{margin-bottom:1rem;}
    .field label{display:block;font-size:.72rem;font-weight:600;color:var(--color-text-secondary);margin-bottom:.375rem;letter-spacing:.01em;}
    .field input{width:100%;padding:.5625rem .875rem;border-radius:.5rem;border:1.5px solid var(--color-border);background:var(--color-bg);color:var(--color-text-primary);font-size:.875rem;outline:none;transition:border-color .18s,box-shadow .18s;font-family:inherit;}
    .field input:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(196,18,26,.14);}
    .field input::placeholder{color:var(--color-text-muted);}
    .btn{display:block;width:100%;padding:.6875rem;border-radius:.5rem;background:linear-gradient(135deg,#C4121A,#5A0B0B);color:#fff;font-size:.875rem;font-weight:700;border:none;cursor:pointer;font-family:inherit;transition:all .18s;box-shadow:0 2px 10px rgba(196,18,26,.35);margin-top:1.25rem;}
    .btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(196,18,26,.45);}
    .error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#EF4444;border-radius:.5rem;padding:.625rem .875rem;font-size:.8125rem;margin-bottom:1rem;}
  </style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">
    <img src="{% static 'images/logo.webp' %}" alt="Solution Copiers">
  </div>
  <h1>Portal Asesoras</h1>
  <p class="login-sub">Solution Copiers — Acceso al panel operativo</p>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="field">
      <label>Usuario</label>
      <input type="text" name="username" autofocus autocomplete="username" placeholder="tu_usuario">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" name="password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <button type="submit" class="btn">Ingresar al panel</button>
  </form>
</div>
</body>
</html>
