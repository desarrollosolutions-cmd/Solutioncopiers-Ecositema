# Blueprint de despliegue para Render.com
# Documentación: https://render.com/docs/blueprint-spec
#
# Uso: en el dashboard de Render, "New +" -> "Blueprint" -> conectar este repo.
# Render detecta este archivo automáticamente y crea el servicio.
#
# IMPORTANTE: las variables marcadas con "sync: false" deben pegarse manualmente
# en el dashboard de Render (Environment) porque son secretos que no deben
# vivir en este archivo versionado.

services:
  - type: web
    name: solution-copiers
    runtime: python
    plan: starter
    region: oregon
    buildCommand: "bash build.sh"
    startCommand: "gunicorn solution_copiers.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: DJANGO_SETTINGS_MODULE
        value: solution_copiers.settings.production
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "4"

      # --- Secretos: pegar manualmente en el dashboard de Render ---
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: LEADS_NOTIFICATION_EMAIL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CALLMEBOT_APIKEY
        sync: false
      - key: WHATSAPP_NOTIFY_PHONE
        sync: false
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_PRIVATE_KEY
        sync: false
      - key: WOMPI_INTEGRITY_KEY
        sync: false
      - key: WOMPI_EVENTS_KEY
        sync: false

      # --- Cloudflare R2 (almacenamiento de imágenes) ---
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_CUSTOM_DOMAIN
        sync: false
